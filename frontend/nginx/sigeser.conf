# Nginx de SIGESER: sirve la SPA, reenvía /api al backend y aplica cabeceras de seguridad.
server_tokens off;

# Defensa en profundidad para el ingreso: además del límite de Django, Nginx frena ráfagas por IP.
limit_req_zone $binary_remote_addr zone=ingreso:10m rate=20r/m;

upstream sigeser_backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv;

    # Comprobación de salud del propio Nginx (no expone información).
    location = /salud-web {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location = /api/v1/auth/login {
        limit_req zone=ingreso burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    # Carga de fotos (RF-33) y notas de voz (RF-37): únicos puntos que admiten cuerpos grandes. Django vuelve a
    # validar el tamaño y el contenido real del archivo.
    location ~ ^/api/v1/ordenes/[0-9]+/(fotos|notas-voz)$ {
        client_max_body_size 10m;
        client_body_timeout 60s;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    # La API define sus propias cabeceras de seguridad (middleware de Django).
    location /api/ {
        include /etc/nginx/snippets/proxy-api.conf;
    }

    # Archivos estáticos de Django (interfaz de la documentación OpenAPI).
    location /static/ {
        alias /srv/static/;
        expires 7d;
        access_log off;
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
    }

    # Recursos de la SPA con nombre por contenido (hash): se pueden guardar en caché por un año.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
    }

    # Videotutoriales (RF-34): video, subtítulos WebVTT y portadas. Nginx admite peticiones por rangos (seek).
    location /tutoriales/ {
        root /usr/share/nginx/html;
        types {
            video/mp4 mp4;
            video/webm webm;
            text/vtt vtt;
            image/jpeg jpg;
        }
        expires 7d;
        add_header Cache-Control "public" always;
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
    }

    # Rutas de la SPA: cualquier ruta desconocida devuelve index.html y React Router la resuelve.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
    }
}
