# Cabeceras de seguridad de la interfaz web (OWASP Secure Headers).
# La cámara y el micrófono se permiten solo al propio sitio: fotos del equipo (RF-33) y notas de voz (RF-37).
# Se incluyen en cada location porque add_header no se hereda cuando una location define el suyo.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
