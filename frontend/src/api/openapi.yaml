components:
  schemas:
    Actividad:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        tecnico:
          type: integer
          readOnly: true
        tecnico_nombre:
          type: string
          readOnly: true
        descripcion:
          type: string
        fecha_inicio:
          type: string
          format: date-time
        fecha_fin:
          type: string
          format: date-time
          nullable: true
        horas_empleadas:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
      required:
      - descripcion
      - horas_empleadas
      - id
      - tecnico
      - tecnico_nombre
    ActividadRequest:
      type: object
      properties:
        descripcion:
          type: string
          minLength: 1
        fecha_inicio:
          type: string
          format: date-time
        fecha_fin:
          type: string
          format: date-time
          nullable: true
        horas_empleadas:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
      required:
      - descripcion
      - horas_empleadas
    AgregarRepuestoRequest:
      type: object
      properties:
        repuesto:
          type: integer
        cantidad:
          type: integer
          maximum: 1000
          minimum: 1
      required:
      - cantidad
      - repuesto
    AprobacionRequest:
      type: object
      properties:
        aprobado:
          type: boolean
        esperar_repuestos:
          type: boolean
          default: false
        observacion:
          type: string
          default: ''
          maxLength: 1000
      required:
      - aprobado
    AsignarTecnicoRequest:
      type: object
      properties:
        tecnico:
          type: integer
      required:
      - tecnico
    BlankEnum:
      enum:
      - ''
    CambioContrasenaRequest:
      type: object
      properties:
        contrasena_actual:
          type: string
          minLength: 1
        contrasena_nueva:
          type: string
          minLength: 12
          maxLength: 128
      required:
      - contrasena_actual
      - contrasena_nueva
    CancelarRequest:
      type: object
      properties:
        motivo:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - motivo
    Cliente:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        tipo_documento:
          $ref: '#/components/schemas/TipoDocumentoEnum'
        numero_documento:
          type: string
          maxLength: 20
        nombre:
          type: string
          maxLength: 150
        telefono:
          type: string
          maxLength: 20
        correo:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        direccion:
          type: string
          maxLength: 200
        autoriza_datos:
          type: boolean
        fecha_autorizacion:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        activo:
          type: boolean
          readOnly: true
        creado_en:
          type: string
          format: date-time
          readOnly: true
        equipos:
          type: array
          items:
            $ref: '#/components/schemas/Equipo'
          readOnly: true
      required:
      - activo
      - creado_en
      - equipos
      - fecha_autorizacion
      - id
      - nombre
      - numero_documento
      - telefono
      - tipo_documento
    ClienteLista:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        tipo_documento:
          $ref: '#/components/schemas/TipoDocumentoEnum'
        numero_documento:
          type: string
          maxLength: 20
        nombre:
          type: string
          maxLength: 150
        telefono:
          type: string
          maxLength: 20
        correo:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        activo:
          type: boolean
        total_equipos:
          type: integer
          readOnly: true
      required:
      - id
      - nombre
      - numero_documento
      - telefono
      - tipo_documento
      - total_equipos
    ClienteRequest:
      type: object
      properties:
        tipo_documento:
          $ref: '#/components/schemas/TipoDocumentoEnum'
        numero_documento:
          type: string
          minLength: 1
          maxLength: 20
        nombre:
          type: string
          minLength: 1
          maxLength: 150
        telefono:
          type: string
          minLength: 1
          maxLength: 20
        correo:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        direccion:
          type: string
          maxLength: 200
        autoriza_datos:
          type: boolean
      required:
      - nombre
      - numero_documento
      - telefono
      - tipo_documento
    DiagnosticoRequest:
      type: object
      properties:
        descripcion:
          type: string
          minLength: 1
        causa_probable:
          type: string
        solucion_propuesta:
          type: string
          minLength: 1
        costo_estimado:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - costo_estimado
      - descripcion
      - solucion_propuesta
    EntregaRequest:
      type: object
      properties:
        recibido_por:
          type: string
          minLength: 1
          maxLength: 150
        observacion:
          type: string
          default: ''
          maxLength: 1000
      required:
      - recibido_por
    EnviarVerificacionRequest:
      type: object
      properties:
        costo_mano_obra:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
    Equipo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        cliente:
          type: integer
          readOnly: true
        tipo:
          type: string
          maxLength: 40
        marca:
          type: string
          maxLength: 60
        modelo:
          type: string
          maxLength: 60
        serial:
          type: string
          maxLength: 80
        descripcion:
          type: string
        creado_en:
          type: string
          format: date-time
          readOnly: true
        total_ordenes:
          type: integer
          readOnly: true
      required:
      - cliente
      - creado_en
      - id
      - marca
      - modelo
      - tipo
      - total_ordenes
    EquipoRequest:
      type: object
      properties:
        tipo:
          type: string
          minLength: 1
          maxLength: 40
        marca:
          type: string
          minLength: 1
          maxLength: 60
        modelo:
          type: string
          minLength: 1
          maxLength: 60
        serial:
          type: string
          maxLength: 80
        descripcion:
          type: string
      required:
      - marca
      - modelo
      - tipo
    EstadoOrdenEnum:
      enum:
      - RECIBIDA
      - EN_DIAGNOSTICO
      - PENDIENTE_APROBACION
      - EN_ESPERA_REPUESTOS
      - EN_REPARACION
      - EN_VERIFICACION
      - LISTA_PARA_ENTREGA
      - ENTREGADA
      - CANCELADA
      type: string
      description: |-
        * `RECIBIDA` - Recibida
        * `EN_DIAGNOSTICO` - En diagnóstico
        * `PENDIENTE_APROBACION` - Pendiente de aprobación
        * `EN_ESPERA_REPUESTOS` - En espera de repuestos
        * `EN_REPARACION` - En reparación
        * `EN_VERIFICACION` - En verificación
        * `LISTA_PARA_ENTREGA` - Lista para entrega
        * `ENTREGADA` - Entregada
        * `CANCELADA` - Cancelada
    EtapaEnum:
      enum:
      - RECEPCION
      - DIAGNOSTICO
      - REPARACION
      - ENTREGA
      type: string
      description: |-
        * `RECEPCION` - Recepción
        * `DIAGNOSTICO` - Diagnóstico
        * `REPARACION` - Reparación
        * `ENTREGA` - Entrega
    Foto:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        etapa:
          $ref: '#/components/schemas/EtapaEnum'
        etapa_nombre:
          type: string
          readOnly: true
        descripcion:
          type: string
          maxLength: 200
        ancho:
          type: integer
          maximum: 2147483647
          minimum: 0
        alto:
          type: integer
          maximum: 2147483647
          minimum: 0
        tamano_bytes:
          type: integer
          maximum: 2147483647
          minimum: 0
        fecha:
          type: string
          format: date-time
        subida_por_nombre:
          type: string
          readOnly: true
        url:
          type: string
          readOnly: true
        url_miniatura:
          type: string
          readOnly: true
      required:
      - alto
      - ancho
      - etapa
      - etapa_nombre
      - id
      - subida_por_nombre
      - tamano_bytes
      - url
      - url_miniatura
    Historial:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        estado_anterior:
          oneOf:
          - $ref: '#/components/schemas/EstadoOrdenEnum'
          - $ref: '#/components/schemas/BlankEnum'
        estado_nuevo:
          $ref: '#/components/schemas/EstadoOrdenEnum'
        observacion:
          type: string
        fecha:
          type: string
          format: date-time
        usuario_nombre:
          type: string
          readOnly: true
      required:
      - estado_nuevo
      - id
      - usuario_nombre
    LoginRequest:
      type: object
      properties:
        correo:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        contrasena:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - contrasena
      - correo
    ObservacionRequest:
      type: object
      properties:
        observacion:
          type: string
          default: ''
          maxLength: 1000
