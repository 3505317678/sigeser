  /api/v1/ordenes:
    get:
      operationId: v1_ordenes_list
      description: UC-07 a UC-18. Las transiciones de estado se hacen solo con las
        acciones, nunca editando el estado.
      parameters:
      - in: query
        name: activas
        schema:
          type: boolean
      - in: query
        name: cliente
        schema:
          type: integer
      - in: query
        name: codigo
        schema:
          type: string
      - in: query
        name: desde
        schema:
          type: string
          format: date
      - in: query
        name: equipo
        schema:
          type: integer
      - in: query
        name: estado
        schema:
          type: array
          items:
            type: string
            enum:
            - CANCELADA
            - ENTREGADA
            - EN_DIAGNOSTICO
            - EN_ESPERA_REPUESTOS
            - EN_REPARACION
            - EN_VERIFICACION
            - LISTA_PARA_ENTREGA
            - PENDIENTE_APROBACION
            - RECIBIDA
        description: |-
          * `RECIBIDA` - Recibida
          * `EN_DIAGNOSTICO` - En diagnóstico
          * `PENDIENTE_APROBACION` - Pendiente de aprobación
          * `EN_ESPERA_REPUESTOS` - En espera de repuestos
          * `EN_REPARACION` - En reparación
          * `EN_VERIFICACION` - En verificación
          * `LISTA_PARA_ENTREGA` - Lista para entrega
          * `ENTREGADA` - Entregada
          * `CANCELADA` - Cancelada
        explode: true
        style: form
      - in: query
        name: hasta
        schema:
          type: string
          format: date
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: prioridad
        schema:
          type: string
          enum:
          - ALTA
          - BAJA
          - MEDIA
        description: |-
          * `BAJA` - Baja
          * `MEDIA` - Media
          * `ALTA` - Alta
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      - name: tamano
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: tecnico
        schema:
          type: integer
      - in: query
        name: vencidas
        schema:
          type: boolean
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrdenListaList'
          description: ''
    post:
      operationId: v1_ordenes_create
      description: UC-07 a UC-18. Las transiciones de estado se hacen solo con las
        acciones, nunca editando el estado.
      tags:
      - v1
